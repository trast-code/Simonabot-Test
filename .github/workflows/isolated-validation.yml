name: Isolated validation

on:
  push:
    branches:
      - test/ci-checks
      - feature/simonabot-customization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out test fork
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install FFmpeg for media tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Run automated tests
        run: bun test
